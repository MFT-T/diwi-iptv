name: Siang IPTV Playlist

on:
  schedule:
    - cron: "0 */3 * * *"  # Tự động chạy 3 tiếng một lần
  workflow_dispatch:
  push:
    paths:
      - "to_siang.py"   # Tự chạy khi cập nhật code

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Set Timezone & Get Current Time
        run: |
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh
          NOW=$(date +'%d/%m/%Y %H:%M')
          echo "VIETNAM_TIME=$NOW" >> $GITHUB_ENV
          echo "Thời gian hiện tại: $NOW ICT"

      - name: Run IPTV updater
        run: python to_siang.py

      - name: Commit & push playlist and EPG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 Đã cập nhật IPTV & EPG (${{ env.VIETNAM_TIME }} ICT)"
          file_pattern: "diwi.m3u diwi.epg.xml
